databases:
  - name: intentwise-ingestion-db
    plan: free
    databaseName: ingestion
    user: ingestion

services:
  - type: web
    name: intentwise-ingestion
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intentwise-ingestion-db
          property: connectionString
      - key: SOURCES_CONFIG_DIR
        value: sources_config
      - key: LOG_LEVEL
        value: INFO
      - key: GITHUB_TOKEN
        sync: false
